name: all-dev-openclaw
version: '2026.5.7'
summary: Personal AI Assistant - Multi-channel AI gateway
description: |
  OpenClaw is a personal AI assistant you run on your own devices.
  It answers you on the channels you already use (WhatsApp, Telegram, Discord, etc.).
  The Gateway is the control plane — the product is the assistant.

title: OpenClaw (ALL Edition)
contact: hello@openclaw.ai
license: MIT
donation: https://github.com/sponsors/openclaw
issues: https://github.com/openclaw/openclaw/issues
source-code: https://github.com/openclaw/openclaw
website: https://openclaw.ai

grade: stable
confinement: strict
base: core24

platforms:
  amd64:
  arm64:

apps:
  gateway:
    command: bin/snap-wrapper.sh gateway run --allow-unconfigured
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind

  node:
    command: bin/snap-wrapper.sh node run
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind

  openclaw:
    command: bin/snap-wrapper.sh
    plugs:
      - network
      - network-bind

  get-token:
    command: bin/snap-wrapper.sh get-token
    plugs:
      - network

  ct-engine:

    command: bin/ct-engine run
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind


layout:
  /etc/openclaw:
    bind: $SNAP_DATA/etc
  /var/lib/openclaw:
    bind: $SNAP_DATA/var/lib

parts:
  openclaw:
    plugin: nil
    source: .
    build-packages:
      - python3
      - make
      - gcc
      - g++
      - curl
      - tar
    stage-packages:
      - libasound2
    override-build: |
      # Determine Node.js architecture
      DPKG_ARCH=$(dpkg --print-architecture)
      if [ "$DPKG_ARCH" = "arm64" ]; then
        NODE_ARCH="arm64"
      else
        NODE_ARCH="x64"
      fi
      
      # Download and extract Node.js
      echo "Downloading Node.js for ${NODE_ARCH}..."
      curl -fsSL https://nodejs.org/dist/v22.18.0/node-v22.18.0-linux-${NODE_ARCH}.tar.gz -o node.tar.gz
      mkdir -p $SNAPCRAFT_PART_INSTALL
      tar -xzf node.tar.gz -C $SNAPCRAFT_PART_INSTALL --strip-components=1
      rm node.tar.gz

      
      # Put node in PATH for the build
      export PATH=$SNAPCRAFT_PART_INSTALL/bin:$PATH
      
      # Install pnpm
      npm install -g pnpm@10.33.2
      export CI=true
      
      # Install dependencies and build
      # Use hoisted linker to avoid external symlinks to the pnpm store
      pnpm install --frozen-lockfile --node-linker=hoisted
      pnpm build
      
      # Force IPv4 preference in compiled SSRF dispatcher to avoid IPv6 timeouts
      find dist -name "ssrf-*.js" -exec sed -i 's/? records.filter((entry) => entry.family === requestedFamily) : records;/? records.filter((entry) => entry.family === requestedFamily) : (records.filter(e => e.family === 4).length > 0 ? records.filter(e => e.family === 4) : records);/g' {} +
      
      pnpm ui:build
      
      # Clean up dev dependencies
      pnpm prune --prod
      
      # Clean up foreign architecture binaries to fix Snapcraft lint warnings and save space
      find node_modules -type d \( -name "*freebsd*" -o -name "*openbsd*" -o -name "*musl*" -o -name "*android*" -o -name "*ia32*" -o -name "*armhf*" -o -name "*loong*" -o -name "*riscv*" \) -prune -exec rm -rf {} +
      if [ "$NODE_ARCH" = "x64" ]; then
        find node_modules -type d \( -name "*arm64*" -o -name "*-arm" \) -prune -exec rm -rf {} +
      else
        find node_modules -type d -name "*x64*" -prune -exec rm -rf {} +
      fi
      
      # Copy required runtime files to the snap install dir
      cp -a openclaw.mjs package.json dist docs extensions node_modules skills patches $SNAPCRAFT_PART_INSTALL/

  scripts:
    plugin: dump
    source: snap/
    organize:
      local/snap-wrapper.sh: bin/snap-wrapper.sh
      local/snap-preload.mjs: bin/snap-preload.mjs
      hooks/configure: snap/hooks/configure
      hooks/install: snap/hooks/install
    prime:
      - bin/snap-wrapper.sh
      - bin/snap-preload.mjs
      - snap/hooks/configure
      - snap/hooks/install

  ct-engine:
    plugin: dump
    source: ../all_snap_plugin
    organize:
      src/ct_engine.py: bin/ct-engine
    stage:
      - bin/ct-engine

  plugin-manifest:
    plugin: dump
    source: .
    organize:
      plugin.yaml: plugin.yaml
    stage:
      - plugin.yaml

  runtime-deps:
    plugin: nil
    stage-packages:
      - python3-minimal
      - ca-certificates
