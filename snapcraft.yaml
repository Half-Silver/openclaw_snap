name: openclaw
version: '2026.4.30'
summary: Personal AI Assistant - Multi-channel AI gateway
description: |
  OpenClaw is a personal AI assistant you run on your own devices.
  It answers you on the channels you already use (WhatsApp, Telegram, Discord, etc.).
  The Gateway is the control plane — the product is the assistant.

grade: stable
confinement: strict
base: core24

platforms:
  amd64:
  arm64:

apps:
  gateway:
    command: bin/snap-wrapper.sh gateway --allow-unconfigured
    daemon: simple
    restart-condition: always
    plugs:
      - network
      - network-bind
      - home

  openclaw:
    command: bin/snap-wrapper.sh
    plugs:
      - network
      - network-bind
      - home

layout:
  /etc/openclaw:
    bind: $SNAP_DATA/etc
  /var/lib/openclaw:
    bind: $SNAP_DATA/var/lib
  # Map the home-based config to the snap user data dir
  $HOME/.openclaw:
    bind: $SNAP_USER_DATA/.openclaw

parts:
  openclaw:
    plugin: npm
    source: .
    npm-include-node: true
    npm-node-version: 22.14.0
    build-packages:
      - python3
      - make
      - gcc
      - g++
    stage-packages:
      - libasound2
    override-build: |
      # Enable corepack and prepare pnpm as used in the project
      corepack enable
      corepack prepare pnpm@10.33.2 --activate
      
      # Install dependencies and build
      pnpm install --frozen-lockfile
      pnpm build
      pnpm ui:build
      
      # Clean up dev dependencies for smaller snap
      pnpm prune --prod
      
      # Standard snapcraft build finish
      snapcraftctl build

    prime:
      - -ui
      - -apps
      - -test
      - -docs
      - -scripts
      - -test-fixtures
      - -vendor
      - -.*

  wrapper:
    plugin: dump
    source: .
    override-build: |
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cat <<EOF > $SNAPCRAFT_PART_INSTALL/bin/snap-wrapper.sh
      #!/bin/sh
      export PATH="\$SNAP/bin:\$SNAP/usr/bin:\$PATH"
      export NODE_ENV=production
      export OPENCLAW_STATE_DIR="\$HOME/.openclaw"
      export OPENCLAW_CONFIG_PATH="\$HOME/.openclaw/openclaw.json"
      
      # Dynamic port support via snap set openclaw port=...
      PORT=\$(snapctl get port)
      if [ -n "\$PORT" ]; then
        export OPENCLAW_GATEWAY_PORT="\$PORT"
      fi
      
      # Ensure the state directory exists
      mkdir -p "\$OPENCLAW_STATE_DIR"
      
      exec "\$SNAP/bin/node" "\$SNAP/openclaw.mjs" "\$@"
      EOF
      chmod +x $SNAPCRAFT_PART_INSTALL/bin/snap-wrapper.sh

  hooks:
    plugin: dump
    source: .
    override-build: |
      mkdir -p $SNAPCRAFT_PART_INSTALL/snap/hooks
      cat <<EOF > $SNAPCRAFT_PART_INSTALL/snap/hooks/configure
      #!/bin/sh -e
      # Hook to react to config changes
      PORT=\$(snapctl get port)
      if [ -n "\$PORT" ]; then
        # Restart the gateway daemon if the port changes
        snapctl restart openclaw.gateway
      fi
      EOF
      chmod +x $SNAPCRAFT_PART_INSTALL/snap/hooks/configure
