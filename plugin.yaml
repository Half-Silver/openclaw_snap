# plugin.yaml — OpenClaw snap manifest for CT Engine
#
# OpenClaw uses the CT Engine in SIDECAR MODE.

app:
  name: "all-dev-openclaw"
  version: "2026.5.7"

config:
  # --- Services ---
  gateway-service: { required: false, type: "string", default: "enabled" }
  node-service: { required: false, type: "string", default: "enabled" }

  # --- Network ---
  port: { required: false, type: "int", default: 3000 }
  bind: { required: false, type: "string", default: "lan" }
  remote-http-ui: { required: false, type: "bool", default: true }

  # --- Core ---
  model: { required: false, type: "string", default: "openrouter/auto" }


  # --- AI Keys ---
  openrouter-api-key: { required: false, type: "string", description: "OpenRouter API Key" }
  openai-api-key: { required: false, type: "string", description: "OpenAI API Key" }
  anthropic-api-key: { required: false, type: "string", description: "Anthropic API Key" }
  gemini-api-key: { required: false, type: "string", description: "Google Gemini API Key" }

  # --- Channels ---
  telegram-bot-token: { required: false, type: "string", description: "Telegram Bot Token" }
  discord-bot-token: { required: false, type: "string", description: "Discord Bot Token" }

  # --- Search ---
  brave-api-key: { required: false, type: "string", description: "Brave Search API Key" }
  perplexity-api-key: { required: false, type: "string", description: "Perplexity API Key" }

# Sidecar mode: engine reports status (including security token)
run:
  command: ""

sidecar:
  status_command: "IP=$(hostname -I | awk '{print $1}'); TOKEN=$(cat $SNAP_COMMON/.openclaw/gateway.token 2>/dev/null || echo 'generating...'); echo \"dashboard: http://$IP:3000?token=$TOKEN\""


output:

  mode: "logs"
  interval: 0

  initial_event: "message_initial"
  stop_event: "deployment_stop"
