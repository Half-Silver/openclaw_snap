app:
  name: "openclaw"
  version: "2026.4.30"

config:
  port: { required: false, type: "int", default: 3000 }
  bind: { required: false, type: "string", default: "lan" }
  remote-http-ui: { required: false, type: "bool", default: true }

# Sidecar mode: ct-engine runs alongside the gateway/node daemons and only
# sends status callbacks to the Control Tower. It does NOT launch the app.
run:
  command: ""

output:
  mode: "logs"
  interval: 5
  initial_event: "message_initial"
  periodic_event: "message"
  stop_event: "deployment_stop"
