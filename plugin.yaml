app:
  name: "openclaw"
  version: "2026.4.30"

config:
  port: { required: false, type: "int", default: 3000 }
  bind: { required: false, type: "string", default: "0.0.0.0" }
  remote-http-ui: { required: false, type: "bool", default: true }

run:
  command: "bin/snap-wrapper.sh gateway"
  workdir: "$SNAP_DATA"

output:
  mode: "logs"
  interval: 5
  event_name: "gateway_status"
